<!DOCTYPE html>
<html lang="es">
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
        <title>Lectura de Sensor</title>
    </head>
    <body>
        <div class="titulo">
            <h1>Registros del Sensor DHT11</h1>
        </div>
        <div class="tabla">
            <table>
                <thead>
                    <tr>
                        <th class="numero">No.</th>
                        <th class="temperatura">Grados C</th>
                        <th class="temperatura">Grados F</th>
                        <th class="temperatura">Grados K</th>
                        <th class="temperatura">Grados R</th>
                        <th class="tiempo">Fecha</th>
                        <th class="tiempo">Hora</th>
                        <th class="estatus">Estatus</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla"></tbody>
            </table>
        </div>
        <div class="opciones">
            <a class="btn" id="descargar">
                <div class="btn-icono">
                    <img src="./assets/descargar.png">
                </div>
                <div class="btn-texto">
                    <p>Descargar</p>
                </div>
            </a>
            <a class="btn" id="limpiar">
                <div class="btn-icono">
                    <img src="./assets/eliminar.png">
                </div>
                <div class="btn-texto">
                    <p>Limpiar</p>
                </div>
            </a>
        </div>
        <script type="module" src="./index.js"></script>
    </body>
</html>
